name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 — минимум из engines (требование @noble/hashes@2); 22 — текущая LTS.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Тарбол — это то, что реально увидит интегратор. Проверяем не сборку,
      # а ИМЕННО его содержимое: тестовые файлы и симуляция кошелька не должны попасть
      # в пакет, даже если кто-то случайно расширит rootDir или files.
      - name: npm pack --dry-run
        run: npm pack --dry-run

      - name: в тарболе нет тестов
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            console.log(files.join('\n'));
            const leaked = files.filter((f) => /(^|\/)(test|tests|__tests__)\//.test(f) || /\.(test|spec)\./.test(f) || /e2e/i.test(f));
            if (leaked.length) { console.error('Тестовые файлы в тарболе:', leaked); process.exit(1); }
            if (!files.includes('dist/index.js') || !files.includes('dist/index.d.ts')) { console.error('В тарболе нет точки входа'); process.exit(1); }
            if (!files.includes('LICENSE')) { console.error('В тарболе нет LICENSE'); process.exit(1); }
          "
